[[hero.quotes]]
text = "注定会成功，仅此而已。"

[[hero.quotes]]
text = "男儿不展凌云志，空负天生八尺躯。"

[[hero.quotes]]
text = "要成为绝世高手，并非一朝一夕。"

[[hero.quotes]]
text = "积土而为山，积水而为海。"
author = "《荀子·儒效》"

[[hero.quotes]]
text = "温柔正确的人总是难以生存，因为这世界既不温柔，也不正确。"
author = "《我的青春恋爱物语果然有问题》"

[[hero.quotes]]
text = "往日无法重来。"

[[hero.quotes]]
text = "且将新火试新茶，诗酒趁年华。"
author = "苏轼《望江南·超然台作》"

[[hero.quotes]]
text = "她那时候还太年轻，不知道所有命运赠送的礼物，早已在暗中标好了价格。"
author = "斯蒂芬·茨威格《断头王后》"

[[hero.quotes]]
text = "凡是过去，皆为序章。"
