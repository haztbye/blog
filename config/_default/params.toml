[[hero.quotes]]
text = "世界上只有一种真正的英雄主义，就是认清生活的真相后依然热爱生活。"
author = "罗曼·罗兰《米开朗琪罗传》"

[[hero.quotes]]
text = "成功只有一个——按照自己的方式，去度过人生。"
author = "当年明月《明朝那些事儿》"

[[hero.quotes]]
text = "既然选择了远方，便只顾风雨兼程。"
author = "汪国真《热爱生命》"

[[hero.quotes]]
text = "行到水穷处，坐看云起时。"
author = "王维《终南别业》"

[[hero.quotes]]
text = "万里归来颜愈少，微笑，笑时犹带岭梅香。"
author = "苏轼《定风波·南海归赠王定国侍人寓娘》"

[[hero.quotes]]
text = "春有百花秋有月，夏有凉风冬有雪。若无闲事挂心头，便是人间好时节。"
author = "无门慧开《无门关》"

[[hero.quotes]]
text = "路漫漫其修远兮，吾将上下而求索。"
author = "屈原《离骚》"

[[hero.quotes]]
text = "星光不问赶路人，时光不负有心人。"

[[hero.quotes]]
text = "愿你我在各自的道路上，都能看见花海。"

[[hero.quotes]]
text = "世界以痛吻我，要我报之以歌。"
