[[hero.quotes]]
text = "不积跬步，无以至千里；不积小流，无以成江海。"
author = "荀子《劝学》"

[[hero.quotes]]
text = "千磨万击还坚劲，任尔东西南北风。"
author = "郑燮《竹石》"

[[hero.quotes]]
text = "会当凌绝顶，一览众山小。"
author = "杜甫《望岳》"

[[hero.quotes]]
text = "长风破浪会有时，直挂云帆济沧海。"
author = "李白《行路难·其一》"

[[hero.quotes]]
text = "海上生明月，天涯共此时。"
author = "张九龄《望月怀远》"

[[hero.quotes]]
text = "每一个不曾起舞的日子，都是对生命的辜负。"
