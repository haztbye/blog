# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.png"

[footer]
since = 2020
customText = "愿我们都在去看花海的路上 🌸"

[dateFormat]
published = "2006 年 01 月 02 日"
lastUpdated = "2006 年 01 月 02 日 15:04"

[sidebar]
emoji = "🍮 "
subtitle = "去看花海的路上"

[sidebar.avatar]
enabled = true
local = true
src = "img/avatar.png"

[article]
headingAnchor = false
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = true
local = false
src = "img/og-default.jpg"

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

## Comments
# Disqus 用的是主题作者的演示 shortname，且国内网络基本加载不出来，
# 先关闭以免文章底部留一块空白；以后可以换成 giscus / waline 再打开。
[comments]
enabled = false
provider = "disqus"

