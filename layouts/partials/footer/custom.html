{{- /* 自定义页脚内容：季节标签 + 回到顶部按钮 */ -}}
<span class="season-label" id="season-label" hidden>
    <span class="season-emoji" aria-hidden="true">🌸</span>
    <span class="season-text"></span>
</span>
<button id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5" />
        <path d="M5 12l7-7 7 7" />
    </svg>
</button>

{{- /* 拉链挂件已移至导航（见 partials/sidebar/left.html） */ -}}
<script>
    (function () {
        /* 季节标签：emoji + 文案 */
        var seasonInfo = {
            spring: { emoji: '🌸', text: '春 · 樱' },
            summer: { emoji: '🌿', text: '夏 · 萤' },
            autumn: { emoji: '🍂', text: '秋 · 叶' },
            winter: { emoji: '❄️', text: '冬 · 雪' }
        };
        var season = document.documentElement.getAttribute('data-season') || 'spring';
        var info = seasonInfo[season] || seasonInfo.spring;

        var label = document.getElementById('season-label');
        if (label) {
            label.hidden = false;
            var emojiEl = label.querySelector('.season-emoji');
            var textEl = label.querySelector('.season-text');
            if (emojiEl) { emojiEl.textContent = info.emoji; }
            if (textEl) { textEl.textContent = info.text; }
        }

        /* 页面里所有季节 emoji 占位（如花海进度的小花） */
        Array.prototype.forEach.call(document.querySelectorAll('.season-emoji'), function (el) {
            el.textContent = info.emoji;
        });

        /* 季节飘落叶片：春樱瓣 / 夏绿叶 / 秋枫叶 / 冬雪花（每种随机取同系三种色）
           桌面多、手机少而小（手机上也要有，只是更省性能） */
        (function () {
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var season = document.documentElement.getAttribute('data-season') || 'spring';

            function pick(list) {
                return list[Math.floor(Math.random() * list.length)];
            }

            var shapes = {
                spring: {
                    min: 11, max: 20,
                    svg: function () {
                        var tint = pick(['#f9c6dc', '#f7b8d3', '#f2a5c6']);
                        return '<svg viewBox="0 0 24 24"><path d="M12 22C7 17.5 4 13 4.6 8.6 5 5.6 7.4 3.4 9.6 4.8c1.2.7 1.6 1.8 2.4 1.8.8 0 1.2-1.1 2.4-1.8 2.2-1.4 4.6.8 5 3.8C20 13 17 17.5 12 22Z" fill="' + tint + '" stroke="#e78fb4" stroke-width="0.7"/></svg>';
                    }
                },
                summer: {
                    min: 12, max: 21,
                    svg: function () {
                        var tint = pick(['#7ec98f', '#6fbf87', '#8fd39e']);
                        return '<svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" fill="' + tint + '"/><path d="M4 21c0-3 1.85-5.36 5.08-6C11.5 14.5 12 13 13 12" fill="none" stroke="#3f8f57" stroke-width="1" stroke-linecap="round"/></svg>';
                    }
                },
                autumn: {
                    min: 15, max: 26,
                    emoji: '🍂'
                },
                winter: {
                    min: 13, max: 24,
                    emoji: '❄️'
                }
            };
            var conf = shapes[season] || shapes.spring;

            var lastSmall = null;

            function build() {
                /* PJAX 换页后本脚本会再执行一次：先清掉旧图层，避免花瓣叠加 */
                Array.prototype.forEach.call(document.querySelectorAll('.petal-fall'), function (el) { el.remove(); });
                if (reduce) { return; }

                var isSmall = window.innerWidth < 760;
                lastSmall = isSmall;
                var count = isSmall ? 14 : 34;   /* 手机上少一半以上 */
                var scale = isSmall ? 0.8 : 1;   /* 手机上也小一号 */

                var layer = document.createElement('div');
                layer.className = 'petal-fall';
                layer.setAttribute('aria-hidden', 'true');

                for (var i = 0; i < count; i++) {
                    var item = document.createElement('span');
                    item.className = 'petal-fall-item';
                    var size = (conf.min + Math.random() * (conf.max - conf.min)) * scale;
                    item.style.left = (Math.random() * 108 + 2).toFixed(2) + '%';
                    item.style.width = size.toFixed(1) + 'px';
                    item.style.height = size.toFixed(1) + 'px';
                    item.style.opacity = (0.32 + Math.random() * 0.38).toFixed(2);
                    item.style.animationDuration = (2.5 + Math.random() * 4).toFixed(1) + 's';
                    item.style.animationDelay = (-Math.random() * 8).toFixed(1) + 's';
                    /* 像刮大风：大幅向左下横扫 + 快速旋转（手机上幅度小一点） */
                    item.style.setProperty('--drift', (-(320 + Math.random() * 320) * (isSmall ? 0.7 : 1)).toFixed(0) + 'px');
                    item.style.setProperty('--spin', (-(720 + Math.random() * 720)).toFixed(0) + 'deg');
                    if (conf.emoji) {
                        item.textContent = conf.emoji;
                        item.style.fontSize = size.toFixed(1) + 'px';
                        item.style.lineHeight = size.toFixed(1) + 'px';
                        item.style.textAlign = 'center';
                    } else {
                        item.innerHTML = conf.svg();
                    }
                    layer.appendChild(item);
                }

                document.body.appendChild(layer);
            }

            window.__hhPetalBuild = build;
            build();

            /* 手机横竖屏切换 / 跨断点时重建（全局只注册一次，PJAX 换页不会重复叠加监听） */
            if (!window.__hhPetalResizeBound) {
                window.__hhPetalResizeBound = true;
                window.__hhPetalResizeTimer = 0;
                window.addEventListener('resize', function () {
                    window.clearTimeout(window.__hhPetalResizeTimer);
                    window.__hhPetalResizeTimer = window.setTimeout(function () {
                        if (window.__hhPetalBuild) { window.__hhPetalBuild(); }
                    }, 200);
                });
            }
        }());

        /* 回到顶部：事件委托 + 全局只注册一次，PJAX 换页后依旧有效 */
        if (!window.__hhBackTopBound) {
            window.__hhBackTopBound = true;
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            window.__hhBackTopUpdate = function () {
                var b = document.getElementById('back-to-top');
                if (b) { b.classList.toggle('show', window.scrollY > 420); }
            };

            window.addEventListener('scroll', window.__hhBackTopUpdate, { passive: true });

            document.addEventListener('click', function (e) {
                var b = e.target && e.target.closest ? e.target.closest('#back-to-top') : null;
                if (!b) { return; }
                window.scrollTo({
                    top: 0,
                    behavior: reduceMotion.matches ? 'auto' : 'smooth'
                });
            });
        }
        if (window.__hhBackTopUpdate) { window.__hhBackTopUpdate(); }
    }());
</script>
