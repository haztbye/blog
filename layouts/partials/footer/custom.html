{{- /* 自定义页脚内容：季节标签 + 回到顶部按钮 */ -}}
<span class="season-label" id="season-label" hidden>
    <span class="season-emoji" aria-hidden="true">🌸</span>
    <span class="season-text"></span>
</span>
<button id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5" />
        <path d="M5 12l7-7 7 7" />
    </svg>
</button>
<script>
    (function () {
        /* 季节标签：emoji + 文案 */
        var seasonInfo = {
            spring: { emoji: '🌸', text: '春 · 樱' },
            summer: { emoji: '🌿', text: '夏 · 萤' },
            autumn: { emoji: '🍂', text: '秋 · 叶' },
            winter: { emoji: '❄️', text: '冬 · 雪' }
        };
        var season = document.documentElement.getAttribute('data-season') || 'spring';
        var info = seasonInfo[season] || seasonInfo.spring;

        var label = document.getElementById('season-label');
        if (label) {
            label.hidden = false;
            var emojiEl = label.querySelector('.season-emoji');
            var textEl = label.querySelector('.season-text');
            if (emojiEl) { emojiEl.textContent = info.emoji; }
            if (textEl) { textEl.textContent = info.text; }
        }

        /* 页面里所有季节 emoji 占位（如花海进度的小花） */
        Array.prototype.forEach.call(document.querySelectorAll('.season-emoji'), function (el) {
            el.textContent = info.emoji;
        });

        /* 季节飘落花瓣：一点点，够味道就行 */
        (function () {
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce || window.innerWidth < 760) return;

            var season = document.documentElement.getAttribute('data-season') || 'spring';
            var shapes = {
                spring: { path: 'M12 2c3.2 4.4 8 6.8 8 12a8 8 0 0 1-16 0c0-5.2 4.8-7.6 8-12z', fill: '#f7b8d3' },
                summer: { path: 'M12 3c6.5 4 8.5 11.5 0 18-8.5-6.5-6.5-14 0-18z', fill: '#8ed7a9' },
                autumn: { path: 'M12 2l2.2 5.6L20 6l-2.6 5.2L22 13l-5.4 1.2L18 20l-6-3.4L6 20l1.4-5.8L2 13l4.6-1.8L4 6l5.8 1.6z', fill: '#e08a3c' },
                winter: { path: '', fill: '#cfe0ff', stroke: true }
            };
            var conf = shapes[season] || shapes.spring;

            var layer = document.createElement('div');
            layer.className = 'petal-fall';
            layer.setAttribute('aria-hidden', 'true');

            for (var i = 0; i < 12; i++) {
                var item = document.createElement('span');
                item.className = 'petal-fall-item';
                var size = 11 + Math.random() * 11;
                item.style.left = (Math.random() * 100).toFixed(2) + '%';
                item.style.width = size.toFixed(1) + 'px';
                item.style.height = size.toFixed(1) + 'px';
                item.style.opacity = (0.32 + Math.random() * 0.38).toFixed(2);
                item.style.animationDuration = (12 + Math.random() * 12).toFixed(1) + 's';
                item.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
                item.style.setProperty('--drift', (Math.random() * 140 - 70).toFixed(0) + 'px');
                item.style.setProperty('--spin', (Math.random() * 720 - 360).toFixed(0) + 'deg');
                item.innerHTML = conf.stroke
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="' + conf.fill + '" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>'
                    : '<svg viewBox="0 0 24 24"><path d="' + conf.path + '" fill="' + conf.fill + '"' +
                    (season === 'autumn' ? ' stroke="#b5651d" stroke-width="0.9" stroke-linejoin="round"' : '') + '/></svg>';
                layer.appendChild(item);
            }

            document.body.appendChild(layer);
        }());

        /* 回到顶部 */
        var btn = document.getElementById('back-to-top');
        if (!btn) return;

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function update() {
            btn.classList.toggle('show', window.scrollY > 420);
        }

        window.addEventListener('scroll', update, { passive: true });
        update();

        btn.addEventListener('click', function () {
            window.scrollTo({
                top: 0,
                behavior: reduceMotion.matches ? 'auto' : 'smooth'
            });
        });
    }());
</script>
