{{- /* 站点级覆盖主题的 giscus 模板：加玻璃卡片外框 + 评论标题分隔线。
       主题配色来自 static/giscus/{light,dark}.css（giscus 自定义主题）。 */ -}}
{{- with .Site.Params.comments.giscus -}}
<div class="giscus-wrap">
    <div class="giscus-wrap-head" aria-hidden="true">
        <span class="giscus-wrap-line"></span>
        <span class="giscus-wrap-title">留下一句话</span>
        <span class="giscus-wrap-line"></span>
    </div>
    <script
        src="https://giscus.app/client.js"
        data-repo="{{- .repo -}}"
        data-repo-id="{{- .repoID -}}"
        data-category="{{- .category -}}"
        data-category-id="{{- .categoryID -}}"
        data-mapping="{{- default `title` .mapping -}}"
        data-strict="{{- default 0 .strict -}}"
        data-reactions-enabled="{{- default 1 .reactionsEnabled -}}"
        data-emit-metadata="{{- default 0 .emitMetadata -}}"
        data-input-position="{{- default `top` .inputPosition -}}"
        data-theme="{{- default `light` .lightTheme -}}"
        data-lang="{{- default `en` .lang -}}"
        data-loading="{{- .loading -}}"
        crossorigin="anonymous"
        async
    ></script>
    <script>
        function setGiscusTheme(theme) {
            var giscus = document.querySelector('iframe.giscus-frame');
            if (giscus) {
                giscus.contentWindow.postMessage(
                    {
                        giscus: {
                            setConfig: {
                                theme: theme
                            }
                        }
                    },
                    'https://giscus.app'
                );
            }
        }

        (function () {
            addEventListener('message', function (e) {
                if (e.origin !== 'https://giscus.app') return;
                handler();
            });
            window.addEventListener('onColorSchemeChange', handler);

            function handler() {
                if (document.documentElement.dataset.scheme === 'light') {
                    setGiscusTheme('{{- default "light" .lightTheme -}}');
                } else {
                    setGiscusTheme('{{- default "dark_dimmed" .darkTheme -}}');
                }
            }
        })();
    </script>
</div>
{{- end -}}
