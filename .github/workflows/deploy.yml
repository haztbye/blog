name: Deploy to server

# 每次 push 到 master（或手动触发）时，在 GitHub 上构建并同步到自己的服务器。
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   SERVER_HOST      服务器地址（IP 或域名）
#   SERVER_USER      登录用户（如 root）
#   SERVER_SSH_KEY   专用部署私钥（hugo_deploy_ed25519 的完整内容）
#   SERVER_PORT      SSH 端口（可选，默认 22）

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
      DEPLOY_PATH: /www/wwwroot/huanhe.site

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing SERVER_HOST"
          [ -z "$SSH_USER" ] && missing="$missing SERVER_USER"
          [ -z "$SSH_KEY" ] && missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub Secrets:$missing （Settings → Secrets and variables → Actions 添加）"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          rsync -az --delete \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chown -R www:www $DEPLOY_PATH 2>/dev/null; chmod -R 755 $DEPLOY_PATH 2>/dev/null; echo DEPLOY_DONE"
